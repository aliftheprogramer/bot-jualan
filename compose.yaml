services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yoshstore
      POSTGRES_USER: yoshstore
      POSTGRES_PASSWORD: yoshstore_local_only
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoshstore -d yoshstore"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
